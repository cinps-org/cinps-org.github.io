<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CINPS Fee Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 40px 32px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eaf3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            color: #1261a0;
        }

        h1 {
            margin: 0;
            font-size: 25px;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
        }

        .google-btn {
            width: 100%;
            border: 1px solid #d0d5dd;
            background: white;
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #f8fafc;
        }

        .google-icon {
            font-size: 18px;
            font-weight: bold;
        }

        #status {
            margin-top: 20px;
            font-size: 13px;
            color: #667085;
            min-height: 20px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #98a2b3;
        }

        .hidden {
            display: none;
        }

        .user-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }

        .logout-btn {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #172033;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            C
        </div>

        <h1>CINPS Fee Management</h1>

        <div class="subtitle">
            Secure Administration Portal<br>
            Chandidas Institute of Nursing & Paramedical Science
        </div>

        <button id="googleLogin" class="google-btn">
            <span class="google-icon">G</span>
            Continue with Google
        </button>

        <div id="status">
            Secure login required.
        </div>

        <div id="userBox" class="user-box hidden">
            <strong>Signed in as:</strong>
            <div id="userEmail"></div>

            <button id="logoutBtn" class="logout-btn">
                Sign Out
            </button>
        </div>

        <div class="footer">
            CINPS Fee Management System
        </div>

    </div>

</div>


<!-- Firebase -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
        initializeAppCheck,
        ReCaptchaEnterpriseProvider
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";


    /* ==========================================
       CINPS FEE MANAGEMENT - FIREBASE CONFIG
       ========================================== */

    const firebaseConfig = {
        apiKey: "AIzaSyDqN3aY4RHIBX_roHaNopjX3TeYcAjJwho",
        authDomain: "cinps-fee-management.firebaseapp.com",
        projectId: "cinps-fee-management",
        storageBucket: "cinps-fee-management.firebasestorage.app",
        messagingSenderId: "806314606010",
        appId: "1:806314606010:web:18bce6d813e56fe14f183"
    };


    /* ==========================================
       INITIALIZE FIREBASE
       ========================================== */

    const app = initializeApp(firebaseConfig);


    /* ==========================================
       FIREBASE APP CHECK
       Fraud Defense / reCAPTCHA Enterprise
       ========================================== */

    const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaEnterpriseProvider(
            "6LCvldwtAAAAAKg2ccnb3j-szK-1DRIzn4Y8dHjM"
        ),
        isTokenAutoRefreshEnabled: true
    });


    /* ==========================================
       FIREBASE AUTHENTICATION
       ========================================== */

    const auth = getAuth(app);

    const googleProvider = new GoogleAuthProvider();


    /* ==========================================
       PAGE ELEMENTS
       ========================================== */

    const googleLogin = document.getElementById("googleLogin");
    const logoutBtn = document.getElementById("logoutBtn");
    const status = document.getElementById("status");
    const userBox = document.getElementById("userBox");
    const userEmail = document.getElementById("userEmail");


    /* ==========================================
       GOOGLE LOGIN
       ========================================== */

    googleLogin.addEventListener("click", async () => {

        try {

            status.textContent = "Opening secure Google login...";

            await signInWithPopup(auth, googleProvider);

        } catch (error) {

            console.error(error);

            status.textContent =
                "Login failed: " + error.message;

        }

    });


    /* ==========================================
       LOGOUT
       ========================================== */

    logoutBtn.addEventListener("click", async () => {

        try {

            await signOut(auth);

            status.textContent = "You have been signed out.";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Sign out failed.";

        }

    });


    /* ==========================================
       AUTH STATE
       ========================================== */

    onAuthStateChanged(auth, (user) => {

        if (user) {

            googleLogin.classList.add("hidden");

            userBox.classList.remove("hidden");

            userEmail.textContent =
                user.email || "Google account";

            status.textContent =
                "Authentication successful.";

            console.log("Firebase UID:", user.uid);

        } else {

            googleLogin.classList.remove("hidden");

            userBox.classList.add("hidden");

            status.textContent =
                "Secure login required.";

        }

    });

</script>

</body>
</html>
